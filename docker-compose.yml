version: '3.8'

services:
  mariadb-db:
    image: mariadb:10.11
    container_name: mariadb-db
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ""
      MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
      MYSQL_DATABASE: biblioteca_dev
    networks:
      - network-biblioteca
    healthcheck:
      test: ["CMD", "mariadb-admin", "ping", "-h", "localhost", "-u", "root"]
      interval: 10s
      timeout: 5s
      retries: 20

  eureka-server:
    build: ./eureka
    container_name: eureka-server
    ports:
      - "8761:8761"
    networks:
      - network-biblioteca
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8761/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s

  api-gateway:
    build: ./gateway
    container_name: api-gateway
    ports:
      - "8080:8080"
    environment:
      EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE: http://eureka-server:8761/eureka/
      SPRING_PROFILES_ACTIVE: dev
    networks:
      - network-biblioteca
    depends_on:
      eureka-server:
        condition: service_healthy

  ms1-clientes:
    build: ./MS1
    container_name: ms1-clientes
    environment:
      SPRING_PROFILES_ACTIVE: dev
      EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE: http://eureka-server:8761/eureka/
      DATABASE_HOST: mariadb-db
    networks:
      - network-biblioteca
    depends_on:
      mariadb-db:
        condition: service_healthy
      eureka-server:
        condition: service_healthy

  ms2-empleados:
    build: ./MS2
    container_name: ms2-empleados
    environment:
      SPRING_PROFILES_ACTIVE: dev
      EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE: http://eureka-server:8761/eureka/
      DATABASE_HOST: mariadb-db
    networks:
      - network-biblioteca
    depends_on:
      mariadb-db:
        condition: service_healthy
      eureka-server:
        condition: service_healthy

  ms3-bibliotecas:
    build: ./MS3
    container_name: ms3-bibliotecas
    environment:
      SPRING_PROFILES_ACTIVE: dev
      EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE: http://eureka-server:8761/eureka/
      DATABASE_HOST: mariadb-db
    networks:
      - network-biblioteca
    depends_on:
      mariadb-db:
        condition: service_healthy
      eureka-server:
        condition: service_healthy

  ms4-libros:
    build: ./MS4
    container_name: ms4-libros
    environment:
      SPRING_PROFILES_ACTIVE: dev
      EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE: http://eureka-server:8761/eureka/
      DATABASE_HOST: mariadb-db
    networks:
      - network-biblioteca
    depends_on:
      mariadb-db:
        condition: service_healthy
      eureka-server:
        condition: service_healthy

networks:
  network-biblioteca:
    driver: bridge